[project]
name = "tally"
version = "1.0.0"
description = "A bank export, into a monthly summary."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tally = "tally.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tally*"]

# rules.toml is the rules, not an extra. Without this an installed tally has no
# rules to read and stops on the first run.
[tool.setuptools.package-data]
tally = ["rules.toml"]
