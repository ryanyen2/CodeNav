# The rules, as data. Edit this file rather than the code.
#
# This is the only place the values live. There are no defaults hidden in the
# modules to fall back on: two copies of one policy drift apart, and the copy
# that loses is always the one somebody edited.
#
# A mistake here stops the run with a message naming this file and the rule, so
# a bad pattern is never quietly treated as "matches nothing".

[categories]
# A merchant that matches nothing below. One of:
#
#   "stop"    the run stops and lists every merchant no rule matched.
#   "bucket"  they are filed together under the name below, and the run goes on.
#
# "stop" because a bucket is a place things go to be forgotten. The summary is
# read for the categories, and a merchant filed under "uncategorised" is money
# nobody looks at again — quietly, which is the part that matters. Stopping puts
# the whole list in front of you, once, with the line each was on.
#
# The cost is real: a statement full of new merchants gives no summary at all
# until each has a rule. "bucket" is there for anybody who would rather have the
# summary now and the rules later.
unmatched = "stop"

# What they are called under "bucket". Unused under "stop".
uncategorised = "uncategorised"

# Merchant patterns to categories, in order. The FIRST match wins, which is why
# the specific ones are above the general ones: "shell energy" is a utility and
# "shell" is fuel, and a list in the other order would put the electricity bill
# in the car. Order in this file is the order they are tried in.
#
# Patterns are regular expressions and are matched case-insensitively against
# the description, anywhere in it.
#
# The alternative is to require exactly one match and refuse when two apply.
# That is stricter and it is what an accounting system should do; here it would
# stop the month's summary over one ambiguous coffee shop.

[[categories.rules]]
match = "shell energy|british gas|octopus energy"
category = "utilities"

[[categories.rules]]
match = "shell|bp\\b|esso|texaco"
category = "fuel"

[[categories.rules]]
match = "tesco|sainsbury|aldi|lidl|co-?op|waitrose"
category = "groceries"

[[categories.rules]]
match = "pret|greggs|costa|starbucks|caf[eé]"
category = "eating out"

[[categories.rules]]
match = "tfl|trainline|uber|citymapper"
category = "transport"

[[categories.rules]]
match = "netflix|spotify|patreon"
category = "subscriptions"

[[categories.rules]]
match = "boots|pharmacy|nhs"
category = "health"

[[categories.rules]]
match = "rent|landlord"
category = "housing"

[[categories.rules]]
match = "salary|payroll"
category = "income"

[periods]
# Which date decides the month, and which decides the week.
#
#   "made"    the date the payment was made, which is what the person remembers.
#   "posted"  the date the bank cleared it, which is what the statement shows.
#
# A card payment made on the 31st can post on the 2nd, so the two disagree at
# every month end and at most week ends.
#
# Different answers on purpose. The monthly summary answers "what did I spend in
# January", where the date it was made is the honest one. The weekly summary is
# read next to the statement the bank sends, so it lines up on the date the bank
# used — otherwise reconciling means doing the shifting in your head.
#
# Recurring payments are counted in months by the date they were made whatever
# this says, because that is about when the commitment falls, not about which
# summary is being read.
month = "made"
week = "posted"

[duplicates]
# What makes two rows the same transaction. Both always need the same date and
# the same amount; this is about the description.
#
#   "same wording"  the descriptions have to match too. Two rows for the same
#                   amount on the same day are usually two things, not one.
#   "any wording"   the description is ignored, for a bank that words the pending
#                   row and the settled row differently.
#
# The date compared is the one [periods] gives that summary, so a weekly summary
# lined up on the posting date merges what the bank posted together.
#
# "any wording" merges a genuine second purchase of the same amount on the same
# day — two identical coffees, two identical fares — and there is no way for it
# not to. That is why anything merged under it is listed at the end of the
# summary, under "Merged", with both descriptions: the ones it got wrong are
# visible rather than silently gone.
#
# Set per summary, which means the monthly and weekly files can disagree about
# how many transactions there were. That is the point here, and it is worth
# knowing before the two are compared line by line.
month = "same wording"
week = "any wording"

[transfers]
# Money moved between the account holder's own accounts, recognised by wording.
# Matched case-insensitively, anywhere in the description.
words = ["transfer", "to savings", "from savings", "own account", "xfer"]

# What to do with them. One of:
#
#   "apart"     listed under each month or week, and left out of its total.
#   "never"     left out of the summary altogether, as if they had not happened.
#   "spending"  counted in the totals, under the category named below.
#
# "apart" because both of the other answers hide something. Left out entirely, a
# standing order into savings never appears at all, and a person looking for
# where their month went cannot find it. Counted as spending, it is money the
# person still has, and a month of shuffling savings around reads as a month of
# spending — worse, if the export carries both legs of a move, once out of the
# current account and once into the savings account, counting them adds a move
# that never happened to the total.
#
# Listed apart, the money is visible and no total claims it was spent.
#
# The figure is the sum of the transfer rows in that period, which depends on
# what the bank wrote. One row a move, the usual case for a single account, and
# it is the amount moved. Both legs of a move, and it is either twice that or
# nothing at all, depending on whether the bank wrote the second leg as money in.
# The line is printed whenever there were transfers, even when they came to
# nothing, so that "they cancelled out" and "there were none" do not look alike.
show = "apart"

# What to call them: the heading on the line under each total, and the category
# they land in when show = "spending".
category = "transfers"

[recurring]
# How many months a payment has to appear in before it counts as recurring. Two
# is a coincidence often enough to be annoying; three is not.
#
# Counted in months even when the summary is by week: a fixed commitment is a
# monthly thing, and a weekly window would call nothing recurring.
months = 3

[money]
# Most exports put spending in as negative. Some put it in as positive, and the
# direction is guessed from the data: if more than this share of the rows are
# positive, the export is one of the other kind and every sign is flipped.
#
# 0.8 rather than 0.5 because an ordinary statement carries a salary and the odd
# refund, and those are money in on a file that needs no flipping.
flip_when_positive_share_above = 0.8
