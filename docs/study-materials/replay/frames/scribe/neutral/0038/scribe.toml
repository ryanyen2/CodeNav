# scribe settings.
#
# Everything here is commented out, and every value shown is the default, so this
# file as it stands changes nothing. It is the list of what can be changed, and
# the place to change it.
#
# Tables at the top level apply to every document. A [document."NAME"] table
# applies only to documents whose file name matches NAME, which may be a glob.
# Where more than one matches, the last one in the file wins.
#
# The full reasoning for each default is in the module named beside it. What is
# written here is the short version: what it costs when it is wrong.


# [furniture] — the running header, the running footer, the page number.
# See scribe/furniture.py.
[furniture]
# How near the top or bottom of a page a line has to be to be considered at all.
# Too small and a header under a masthead is missed; too large and body text near
# the margin is eaten.
# edge = 2

# How much of the document a line has to appear on before it counts as repeated.
# Two pages in five is a running header that started after a title page or
# stopped before the appendices; two in forty is a coincidence. Lower this and a
# section title that repeats over a long chapter will go with it; 0.6 was the
# default before, and is the value to put back if that is your corpus.
# repeat_share = 0.4

# Fewest pages a line must appear on, whatever the share works out at. The larger
# of the two wins, so this is what carries short documents, where a share of a
# small number rounds down to something meaningless. Two is the least that can
# mean anything and is refused below that; raise it to want more evidence.
# min_repeats = 2

# Fewest pages before any of this runs. Under it, a document is assumed to have
# no furniture: a two page letter whose first line echoes its last would
# otherwise lose both. Not to be confused with min_repeats above: this one is
# about the document, that one is about the line.
# min_pages = 3

# Whether a line that is nothing but a number near an edge is dropped.
# drop_page_numbers = true


# [paragraphs] — putting broken lines and broken words back together.
# See scribe/paragraphs.py.
[paragraphs]
# A line at most this long that ends a sentence also ends the paragraph. Without
# it the last line of a paragraph glues onto the first line of the next. Set it
# too high and a genuinely short sentence mid-paragraph breaks the paragraph.
# short_line = 60

# Keep every hyphen that falls at a line break, rather than only the prefixes
# below. Right for technical writing full of real compounds; wrong for a
# justified column, where most hyphens were put there by the typesetter.
# keep_all_hyphens = false

# The prefixes whose hyphen survives a line break: with "well" listed, "well-"
# and "being" rejoin as "well-being" rather than "wellbeing".
#
# Empty by default: which compounds a corpus contains is a fact about that
# corpus, so this is opted into rather than shipped. The line below is the list
# scribe used to carry, kept here as somewhere to start rather than as a
# recommendation. Trim it to the prefixes your own documents actually use — the
# conversion report lists every word rejoined, which is where to find them.
# keep_hyphen = ["co", "e", "ex", "non", "post", "pre", "re", "self", "semi", "sub", "un", "well"]


# [blocks] — headings and bullets. See scribe/blocks.py.
[blocks]
# A numbered line longer than this is a list item rather than a heading. Raise it
# and long numbered list items are promoted to headings; lower it and real
# headings with long titles are missed.
# max_heading_words = 12


# [notes] — footnotes. See scribe/notes.py.
[notes]
# Collect notes at the end as Markdown footnotes. Off leaves them where the page
# had them, which is what you want if they are asides meant to be read in place.
# collect = true

# How near the foot of a page a numbered line has to be to be a note rather than
# a numbered list item. Too large and half a list moves to the end of the
# document.
# foot_zone = 6


# [text] — ligatures and smart punctuation. See scribe/text.py.
[text]
# Fold them to plain equivalents, because the output is Markdown somebody will
# grep, diff and paste. A corpus being archived for fidelity wants this off.
# normalise = true

# Substitutions applied on top of the built-in table, and after it, so this can
# also override one of them.
# [text.extra]
# "™" = "(tm)"


# [report] — the note written beside each converted document.
[report]
# Off writes the Markdown and nothing else. `--no-report` does the same for one run.
# write = true


# Per document. The name is matched against the file name, so a config file can
# travel with the corpus it describes.
#
# [document."memo.txt".text]
# normalise = false
#
# [document."*-technical.txt".paragraphs]
# keep_all_hyphens = true
