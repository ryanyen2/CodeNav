# Settings for the sample documents.
#
# A section per rule module — [furniture], [paragraphs], [blocks], [notes],
# [text] — sets the default for every document in this directory. A
# [documents."name.txt"] block overrides those for one document only. Anything
# left out keeps the built-in default, so this file only says what is unusual.
# Every key there is is listed in scribe/settings.py.
#
# A directory-wide section would look like this:
#
#     [furniture]
#     repeat_share = 0.5

# The memo breaks one word across a line: "part-" / "signed". "part" is not one
# of the prefixes that keep their hyphen, so by default the memo comes out
# saying "partsigned". Keeping every hyphen is the right trade for two pages of
# prose containing exactly one hyphenated break; it would be the wrong one for
# the report, which is justified and full of hyphens the typesetter put in.
[documents."memo.txt".paragraphs]
keep_all_hyphens = true
