[project]
name = "codenav-semantic-tree"
version = "0.1.0"
description = "CodeNav semantic tree pipeline: extraction, indexing, LLM analysis, tree assembly (used by codenav-api)."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "adalflow>=0.1.0",
    "numpy>=1.24.0",
    "cocoindex[embeddings]>=0.1.0",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.1.0",
    "pgvector>=0.2.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
