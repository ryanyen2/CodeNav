<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--
    Strict CSP for the standalone codoc hub (U2). Replaces the VS Code webview's
    nonce CSP. No inline/eval script — so remote-authored markdown rendered in the
    editor (descriptions, comments) cannot execute. `connect-src 'self'` permits
    the same-origin command POST + the /api/events SSE stream; styles allow inline
    because ProseMirror/TipTap set element styles.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    font-src 'self';
    connect-src 'self';
    base-uri 'none';
    form-action 'none';
    frame-ancestors 'none';
  " />
  <title>codoc</title>
  <link rel="stylesheet" href="/assets/doc-view.css" />
</head>
<body>
  <!-- doc-view.ts builds the tree + editor into #app and, via acquireHostApi(),
       talks to the hub over HTTP POST (commands) + SSE (/api/events). -->
  <div id="app"></div>
  <script src="/assets/doc-view.js"></script>
</body>
</html>
