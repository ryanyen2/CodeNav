[project]
name = "codoc"
version = "0.1.1"
description = "codoc: a feature-tree system that maintains a human-intent-level view of a codebase, synchronized to the underlying code."
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "pycrdt>=0.9.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-languages>=1.10.2",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=3.0.0",
    "cocoindex>=1.0.0",
    "lancedb>=0.30.0",
    "openai>=1.50.0",
    "ollama>=0.3.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
    "uuid-utils>=0.6.0",
    "dotenv>=0.9.9",
    "pathspec>=0.12.0",
    "structlog>=24.0.0",
    "tenacity>=8.2.0",
    "charset-normalizer>=3.3.0",
    "filelock>=3.13.0",
    "watchfiles>=0.21.0",
    "lark>=1.1.0",
    "transformers>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
codoc = "codoc.cli.main:app"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["codoc*"]

[tool.setuptools.package-data]
"codoc.plugin" = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
