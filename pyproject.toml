[project]
name = "codoc"
version = "0.3.0"
description = "codoc: a feature-tree system that maintains a human-intent-level view of a codebase, synchronized to the underlying code."
license = { text = "MIT" }
readme = "README.md"
# tree-sitter-languages ships no cp313 wheels and doesn't build cleanly there, so a
# fresh `pip install codoc` on Python 3.13 would fail. Cap the floor until we move to
# tree-sitter-language-pack. (The VS Code extension provisions its own pinned env and
# is unaffected.)
requires-python = ">=3.11,<3.13"
dependencies = [
    "tree-sitter>=0.23.0",
    "tree-sitter-languages>=1.10.2",
    "cocoindex>=1.0.0",
    "lancedb>=0.30.0",
    "openai>=1.50.0",            # also the Anthropic-compatible and local paths; the claude CLI needs no SDK
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "watchfiles>=0.21.0",
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
sdk = [
    "claude-agent-sdk>=0.1.0",
]
serve = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",  # the GitHub OAuth + collaborator-permission calls (serve/github_auth.py)
]
media = [
    # Enriches url/pdf blocks (codoc/kinds/builtins.py) with extracted content
    # instead of a bare reference. Lazily imported — absent, those blocks just
    # carry the reference and skip enrichment.
    "httpx>=0.27.0",
    "trafilatura>=1.12.0",
    "pypdf>=5.0.0",
]
local = [
    "ollama>=0.3.0",             # provider="ollama"; imported only on that path
]
anthropic = [
    "anthropic>=0.40.0",         # provider="anthropic"; imported only on that path
]

[project.scripts]
codoc = "codoc.cli.main:app"
codoc-mcp = "codoc.mcp.server:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["codoc*"]

[tool.setuptools.package-data]
"codoc" = ["py.typed"]
"codoc.claude.plugin" = ["**/*"]
"codoc.prompts" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Source samples the language-adapter tests parse; not code that runs.
extend-exclude = ["tests/fixtures"]
