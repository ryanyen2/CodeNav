[project]
name = "codoc"
version = "0.2.5"
description = "codoc: a feature-tree system that maintains a human-intent-level view of a codebase, synchronized to the underlying code."
license = { text = "MIT" }
readme = "README.md"
# tree-sitter-languages ships no cp313 wheels and doesn't build cleanly there, so a
# fresh `pip install codoc` on Python 3.13 would fail. Cap the floor until we move to
# tree-sitter-language-pack. (The VS Code extension provisions its own pinned env and
# is unaffected.)
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-languages>=1.10.2",
    "sentence-transformers>=3.0.0",
    "cocoindex>=1.0.0",
    "lancedb>=0.30.0",
    "openai>=1.50.0",
    "ollama>=0.3.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "filelock>=3.13.0",
    "watchfiles>=0.21.0",
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
sdk = [
    "claude-agent-sdk>=0.1.0",
]
serve = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",  # the GitHub OAuth + collaborator-permission calls (serve/github_auth.py)
]
media = [
    # Enriches url/pdf reference blocks (codoc/blocks/reference.py) with real
    # extracted content instead of a bare reference. Lazily imported — absent,
    # those blocks just carry the reference and skip enrichment.
    "httpx>=0.27.0",
    "trafilatura>=1.12.0",
    "pypdf>=5.0.0",
]

[project.scripts]
codoc = "codoc.cli.main:app"
codoc-mcp = "codoc.mcp.server:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["codoc*"]

[tool.setuptools.package-data]
"codoc" = ["py.typed"]
"codoc.plugin" = ["**/*"]
"codoc.prompts" = ["*.txt"]

[tool.pytest.ini_options]
# The study codebases carry their own suites and are run from inside
# themselves, the way a participant runs them. Collected from here they
# fail on import, because they are not installed and are not meant to be.
norecursedirs = ["docs/study-materials/projects/*"]
testpaths = ["tests"]
