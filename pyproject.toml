[project]
name = "codoc"
version = "0.1.1"
description = "codoc: a feature-tree system that maintains a human-intent-level view of a codebase, synchronized to the underlying code."
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-languages>=1.10.2",
    "sentence-transformers>=3.0.0",
    "cocoindex>=1.0.0",
    "lancedb>=0.30.0",
    "openai>=1.50.0",
    "ollama>=0.3.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "filelock>=3.13.0",
    "watchfiles>=0.21.0",
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
sdk = [
    "claude-agent-sdk>=0.1.0",
]
serve = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.1.0",
]
notion = [
    "notion-client>=3.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
codoc = "codoc.cli.main:app"
codoc-mcp = "codoc.mcp.server:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["codoc*"]

[tool.setuptools.package-data]
"codoc.plugin" = ["**/*"]
"codoc.prompts" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
