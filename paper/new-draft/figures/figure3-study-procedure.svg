<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220">
  <defs>
    <style>
      .label { font-family: -apple-system, 'Inter', 'Helvetica Neue', sans-serif; fill: #2D3436; }
      .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; fill: #2D3436; }
      .caption { font-family: -apple-system, 'Inter', 'Helvetica Neue', sans-serif; fill: #555; }
    </style>
    <marker id="arr" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0,0 6,2.5 0,5" fill="#999"/>
    </marker>
  </defs>

  <rect width="720" height="220" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="360" y="20" text-anchor="middle" class="label" font-size="10" font-weight="600">Within-subjects design (N=12, counterbalanced)</text>

  <!-- Timeline baseline -->
  <line x1="40" y1="80" x2="680" y2="80" stroke="#DFE6E9" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Phase 1: Intro -->
  <rect x="40" y="50" width="50" height="50" rx="4" fill="#F8F9FA" stroke="#DFE6E9"/>
  <text x="65" y="72" text-anchor="middle" class="label" font-size="7" font-weight="500">Intro</text>
  <text x="65" y="84" text-anchor="middle" class="mono" font-size="6" fill="#999">5 min</text>

  <!-- Phase 2: Condition A -->
  <rect x="100" y="38" width="200" height="72" rx="6" fill="#F0F7FF" stroke="#5B8DEF" stroke-width="1.2"/>
  <text x="200" y="54" text-anchor="middle" class="label" font-size="9" font-weight="600" fill="#5B8DEF">Condition A</text>

  <!-- Sub-phases of Condition A -->
  <rect x="108" y="60" width="44" height="24" rx="3" fill="#E8F4FD"/>
  <text x="130" y="74" text-anchor="middle" class="mono" font-size="5.5">briefing</text>
  <text x="130" y="82" text-anchor="middle" class="mono" font-size="5" fill="#999">5m</text>

  <rect x="156" y="60" width="44" height="24" rx="3" fill="#E8F4FD"/>
  <text x="178" y="74" text-anchor="middle" class="mono" font-size="5.5">way of</text>
  <text x="178" y="82" text-anchor="middle" class="mono" font-size="5" fill="#999">work 5m</text>

  <rect x="204" y="60" width="44" height="24" rx="3" fill="#D0E8FF" stroke="#5B8DEF" stroke-width="0.5"/>
  <text x="226" y="72" text-anchor="middle" class="mono" font-size="6" font-weight="600">TASK</text>
  <text x="226" y="82" text-anchor="middle" class="mono" font-size="5" fill="#5B8DEF">20m</text>

  <rect x="252" y="60" width="40" height="24" rx="3" fill="#E8F4FD"/>
  <text x="272" y="74" text-anchor="middle" class="mono" font-size="5.5">sign-off</text>
  <text x="272" y="82" text-anchor="middle" class="mono" font-size="5" fill="#999">5m+5m</text>

  <!-- Phase 3: Break -->
  <rect x="310" y="60" width="30" height="32" rx="4" fill="#FFF8E8" stroke="#F0932B" stroke-width="0.8"/>
  <text x="325" y="80" text-anchor="middle" class="label" font-size="6" fill="#F0932B">Break</text>
  <text x="325" y="88" text-anchor="middle" class="mono" font-size="5" fill="#999">5m</text>

  <!-- Phase 4: Condition B -->
  <rect x="350" y="38" width="200" height="72" rx="6" fill="#FFF0F5" stroke="#FF6B9D" stroke-width="1.2"/>
  <text x="450" y="54" text-anchor="middle" class="label" font-size="9" font-weight="600" fill="#FF6B9D">Condition B</text>

  <!-- Sub-phases of Condition B -->
  <rect x="358" y="60" width="44" height="24" rx="3" fill="#FFECF2"/>
  <text x="380" y="74" text-anchor="middle" class="mono" font-size="5.5">briefing</text>
  <text x="380" y="82" text-anchor="middle" class="mono" font-size="5" fill="#999">5m</text>

  <rect x="406" y="60" width="44" height="24" rx="3" fill="#FFECF2"/>
  <text x="428" y="74" text-anchor="middle" class="mono" font-size="5.5">way of</text>
  <text x="428" y="82" text-anchor="middle" class="mono" font-size="5" fill="#999">work 5m</text>

  <rect x="454" y="60" width="44" height="24" rx="3" fill="#FFD6E5" stroke="#FF6B9D" stroke-width="0.5"/>
  <text x="476" y="72" text-anchor="middle" class="mono" font-size="6" font-weight="600">TASK</text>
  <text x="476" y="82" text-anchor="middle" class="mono" font-size="5" fill="#FF6B9D">20m</text>

  <rect x="502" y="60" width="40" height="24" rx="3" fill="#FFECF2"/>
  <text x="522" y="74" text-anchor="middle" class="mono" font-size="5.5">sign-off</text>
  <text x="522" y="82" text-anchor="middle" class="mono" font-size="5" fill="#999">5m+5m</text>

  <!-- Phase 5: Interview -->
  <rect x="560" y="50" width="70" height="50" rx="4" fill="#F0FFF0" stroke="#4ECDC4" stroke-width="1"/>
  <text x="595" y="72" text-anchor="middle" class="label" font-size="7" font-weight="500" fill="#4ECDC4">Interview</text>
  <text x="595" y="84" text-anchor="middle" class="mono" font-size="6" fill="#999">14 min</text>

  <!-- Total time -->
  <text x="650" y="78" class="label" font-size="8" fill="#999">~105</text>
  <text x="650" y="88" class="label" font-size="8" fill="#999">min</text>

  <!-- Counterbalancing note -->
  <g transform="translate(100, 118)">
    <rect x="0" y="0" width="450" height="40" rx="4" fill="#F8F9FA" stroke="#DFE6E9"/>
    <text x="12" y="14" class="label" font-size="7" font-weight="500">Counterbalancing:</text>
    <text x="12" y="26" class="mono" font-size="6.5" fill="#555">Group 1 (n=6): codoc + Project A → baseline + Project B</text>
    <text x="12" y="36" class="mono" font-size="6.5" fill="#555">Group 2 (n=6): baseline + Project B → codoc + Project A</text>
    <text x="280" y="14" class="label" font-size="7" font-weight="500">Recorded session (constructed stimulus):</text>
    <text x="280" y="26" class="mono" font-size="6.5" fill="#555">Same agent session replayed identically to all participants.</text>
    <text x="280" y="36" class="mono" font-size="6.5" fill="#555">Planted problems + codoc daemon response are real.</text>
  </g>

  <!-- Caption -->
  <line x1="16" y1="172" x2="704" y2="172" stroke="#DFE6E9" stroke-width="0.5"/>
  <text x="16" y="188" class="caption" font-size="7.5">
    <tspan font-weight="600" fill="#2D3436">Figure 3.</tspan>
    <tspan fill="#555"> Study procedure. Each participant completes both conditions in a single 105-minute session. The task in each condition is reviewing</tspan>
  </text>
  <text x="16" y="200" class="caption" font-size="7.5" fill="#555">a pre-recorded agent session that made changes to the project. The recording plays identically for all participants; planted problems are documented</text>
  <text x="16" y="212" class="caption" font-size="7.5" fill="#555">in advance and codoc's daemon response (proposals, drift indicators) is the real system running against the real change.</text>
</svg>
