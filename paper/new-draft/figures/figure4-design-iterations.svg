<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340">
  <defs>
    <style>
      .label { font-family: -apple-system, 'Inter', 'Helvetica Neue', sans-serif; fill: #2D3436; }
      .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; fill: #2D3436; }
      .caption { font-family: -apple-system, 'Inter', 'Helvetica Neue', sans-serif; fill: #555; }
    </style>
  </defs>

  <rect width="720" height="340" fill="#FFFFFF"/>

  <!-- ===== LEFT: V1 (File-structure mirror) ===== -->
  <rect x="20" y="16" width="330" height="250" rx="8" fill="none" stroke="#DFE6E9" stroke-width="1.2"/>
  <text x="36" y="36" class="label" font-size="11" font-weight="600" fill="#FF6B9D">V1: File-structure mirror</text>
  <text x="36" y="50" class="label" font-size="8" fill="#999">Studied with 12 developers (CHI 2026)</text>

  <!-- V1 specification example -->
  <rect x="36" y="60" width="160" height="120" rx="4" fill="#FFF8F8" stroke="#FFD6D6"/>
  <text x="44" y="74" class="mono" font-size="7" fill="#999">specification.codoc</text>
  <text x="44" y="90" class="mono" font-size="7">/src</text>
  <text x="52" y="102" class="mono" font-size="7">player.ts</text>
  <text x="60" y="114" class="mono" font-size="7">$fetchPlaylists()</text>
  <text x="60" y="126" class="mono" font-size="7">$formatDuration()</text>
  <text x="52" y="138" class="mono" font-size="7">ui/</text>
  <text x="60" y="150" class="mono" font-size="7">%PlaylistCard</text>
  <text x="60" y="162" class="mono" font-size="7">%TrackRow</text>
  <text x="44" y="174" class="mono" font-size="6" fill="#999"># NL comments as prompts</text>

  <!-- V1 problems -->
  <g transform="translate(210, 62)">
    <rect x="0" y="0" width="128" height="116" rx="4" fill="#FFF0F5"/>
    <text x="8" y="16" class="label" font-size="7" font-weight="600" fill="#FF6B9D">What failed:</text>

    <circle cx="12" cy="32" r="2.5" fill="#FF6B9D"/>
    <text x="20" y="35" class="label" font-size="6.5" fill="#555">Mirrors file explorer</text>
    <text x="20" y="44" class="label" font-size="6" fill="#999">→ redundant view</text>

    <circle cx="12" cy="58" r="2.5" fill="#FF6B9D"/>
    <text x="20" y="61" class="label" font-size="6.5" fill="#555">No change visibility</text>
    <text x="20" y="70" class="label" font-size="6" fill="#999">→ can't see WHAT happened</text>

    <circle cx="12" cy="84" r="2.5" fill="#FF6B9D"/>
    <text x="20" y="87" class="label" font-size="6.5" fill="#555">Communication mismatch</text>
    <text x="20" y="96" class="label" font-size="6" fill="#999">→ devs think in intent,</text>
    <text x="20" y="105" class="label" font-size="6" fill="#999">   not file paths</text>
  </g>

  <!-- V1 what worked -->
  <g transform="translate(36, 186)">
    <rect x="0" y="0" width="302" height="34" rx="4" fill="#E8FFF8"/>
    <text x="8" y="14" class="label" font-size="7" font-weight="600" fill="#4ECDC4">What worked:</text>
    <text x="8" y="26" class="label" font-size="7" fill="#555">Spatial map (recall Mdn 8 vs 5), fewer context switches (23 vs 49), structural memory</text>
  </g>

  <!-- V1 results row -->
  <g transform="translate(36, 228)">
    <rect x="0" y="4" width="58" height="16" rx="3" fill="#E8FFF8"/>
    <text x="6" y="15" class="mono" font-size="6" fill="#4ECDC4">G1 ✓ partial</text>
    <rect x="66" y="4" width="48" height="16" rx="3" fill="#FFF0F5"/>
    <text x="72" y="15" class="mono" font-size="6" fill="#FF6B9D">G2 ✗ fail</text>
    <rect x="122" y="4" width="48" height="16" rx="3" fill="#E8FFF8"/>
    <text x="128" y="15" class="mono" font-size="6" fill="#4ECDC4">G3 ✓ pass</text>
    <rect x="178" y="4" width="48" height="16" rx="3" fill="#FFF0F5"/>
    <text x="184" y="15" class="mono" font-size="6" fill="#FF6B9D">G4 ✗ fail</text>
    <rect x="234" y="4" width="56" height="16" rx="3" fill="#FFF8E8"/>
    <text x="240" y="15" class="mono" font-size="6" fill="#F0932B">G5 ~ absent</text>
  </g>

  <!-- ===== ARROW between V1 and V2 ===== -->
  <g transform="translate(350, 120)">
    <line x1="0" y1="10" x2="16" y2="10" stroke="#2D3436" stroke-width="1.5"/>
    <polygon points="16,10 12,6 12,14" fill="#2D3436"/>
    <text x="0" y="26" class="label" font-size="6" fill="#999">redesign</text>
  </g>

  <!-- ===== RIGHT: V2 (Intent representation) ===== -->
  <rect x="370" y="16" width="330" height="250" rx="8" fill="none" stroke="#5B8DEF" stroke-width="1.2"/>
  <text x="386" y="36" class="label" font-size="11" font-weight="600" fill="#5B8DEF">V2: Intent representation</text>
  <text x="386" y="50" class="label" font-size="8" fill="#999">Current system (this paper)</text>

  <!-- V2 feature tree example -->
  <rect x="386" y="60" width="160" height="120" rx="4" fill="#F0F7FF" stroke="#D0E8FF"/>
  <text x="394" y="74" class="mono" font-size="7" fill="#999">tree.codoc</text>

  <rect x="394" y="82" width="7" height="7" rx="1.5" fill="#5B8DEF"/>
  <text x="406" y="89" class="mono" font-size="7" font-weight="500">Playlist management</text>
  <line x1="397" y1="92" x2="397" y2="158" stroke="#DFE6E9" stroke-width="0.7"/>

  <circle cx="403" cy="105" r="2.5" fill="#5B8DEF"/>
  <text x="410" y="108" class="mono" font-size="6.5">Fetches user playlists from API</text>

  <circle cx="403" cy="120" r="2.5" fill="none" stroke="#4ECDC4" stroke-width="1"/>
  <text x="410" y="123" class="mono" font-size="6.5" fill="#4ECDC4">Track duration formatting</text>
  <text x="520" y="123" class="mono" font-size="5" fill="#4ECDC4">PROPOSED</text>

  <circle cx="403" cy="135" r="2.5" fill="#5B8DEF"/>
  <text x="410" y="138" class="mono" font-size="6.5">Player transport controls</text>
  <circle cx="508" cy="135" r="2" fill="#FF6B9D"/>

  <circle cx="403" cy="150" r="2.5" fill="none" stroke="#F0932B" stroke-width="1"/>
  <text x="410" y="153" class="mono" font-size="6.5" fill="#F0932B">Keyboard shortcuts</text>
  <text x="520" y="153" class="mono" font-size="5" fill="#F0932B">AMEND</text>

  <text x="394" y="172" class="label" font-size="6" fill="#5B8DEF">Features bind across files.</text>
  <text x="394" y="180" class="label" font-size="6" fill="#5B8DEF">One file's code → many features.</text>

  <!-- V2 design responses -->
  <g transform="translate(558, 62)">
    <rect x="0" y="0" width="128" height="116" rx="4" fill="#F0F7FF"/>
    <text x="8" y="16" class="label" font-size="7" font-weight="600" fill="#5B8DEF">Design responses:</text>

    <circle cx="12" cy="32" r="2.5" fill="#5B8DEF"/>
    <text x="20" y="35" class="label" font-size="6.5" fill="#555">Intent hierarchy</text>
    <text x="20" y="44" class="label" font-size="6" fill="#999">→ what, not where</text>

    <circle cx="12" cy="58" r="2.5" fill="#5B8DEF"/>
    <text x="20" y="61" class="label" font-size="6.5" fill="#555">Proposals + verdicts</text>
    <text x="20" y="70" class="label" font-size="6" fill="#999">→ made to decide</text>

    <circle cx="12" cy="84" r="2.5" fill="#5B8DEF"/>
    <text x="20" y="87" class="label" font-size="6.5" fill="#555">Description + comment</text>
    <text x="20" y="96" class="label" font-size="6" fill="#999">→ say what it SHOULD be,</text>
    <text x="20" y="105" class="label" font-size="6" fill="#999">   not what to DO</text>
  </g>

  <!-- V2 new property -->
  <g transform="translate(386, 186)">
    <rect x="0" y="0" width="302" height="34" rx="4" fill="#F0F7FF"/>
    <text x="8" y="14" class="label" font-size="7" font-weight="600" fill="#5B8DEF">New property — trust threshold:</text>
    <text x="8" y="26" class="label" font-size="7" fill="#555">Verify the map once → reason from it for the rest of the session. Trust > expressivity.</text>
  </g>

  <!-- V2 results row -->
  <g transform="translate(386, 228)">
    <rect x="0" y="4" width="48" height="16" rx="3" fill="#E8FFF8"/>
    <text x="6" y="15" class="mono" font-size="6" fill="#4ECDC4">G1 ✓ sync</text>
    <rect x="56" y="4" width="58" height="16" rx="3" fill="#E8FFF8"/>
    <text x="62" y="15" class="mono" font-size="6" fill="#4ECDC4">G2 ✓ proposals</text>
    <rect x="122" y="4" width="48" height="16" rx="3" fill="#E8FFF8"/>
    <text x="128" y="15" class="mono" font-size="6" fill="#4ECDC4">G3 ✓ trust</text>
    <rect x="178" y="4" width="58" height="16" rx="3" fill="#E8FFF8"/>
    <text x="184" y="15" class="mono" font-size="6" fill="#4ECDC4">G4 ✓ intent</text>
    <rect x="244" y="4" width="50" height="16" rx="3" fill="#E8FFF8"/>
    <text x="250" y="15" class="mono" font-size="6" fill="#4ECDC4">G5 ✓ ledger</text>
  </g>

  <!-- ===== CAPTION ===== -->
  <line x1="16" y1="280" x2="704" y2="280" stroke="#DFE6E9" stroke-width="0.5"/>
  <text x="16" y="296" class="caption" font-size="7.5">
    <tspan font-weight="600" fill="#2D3436">Figure 4.</tspan>
    <tspan fill="#555"> The two design iterations, compared against the five design goals. V1 mirrored file structure and worked as a spatial map but failed</tspan>
  </text>
  <text x="16" y="308" class="caption" font-size="7.5" fill="#555">at showing what changed (G2) and letting developers communicate at the level they think (G4). V2 organizes by intent, surfaces changes as proposals</text>
  <text x="16" y="320" class="caption" font-size="7.5" fill="#555">requiring verdicts, and records every decision. The key property gained: once the developer trusts the map, they reason from it.</text>
</svg>
