<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <defs>
    <style>
      .label { font-family: -apple-system, 'Inter', 'Helvetica Neue', sans-serif; fill: #2D3436; }
      .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; fill: #2D3436; }
      .caption { font-family: -apple-system, 'Inter', 'Helvetica Neue', sans-serif; fill: #555; }
    </style>
    <!-- Arrow marker -->
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#5B8DEF"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#4ECDC4"/>
    </marker>
    <marker id="arrow-pink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#FF6B9D"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#999"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="380" fill="#FFFFFF"/>

  <!-- ===== CENTER: Feature Tree (the shared representation) ===== -->
  <rect x="260" y="50" width="200" height="160" rx="8" fill="#F0F7FF" stroke="#5B8DEF" stroke-width="1.5"/>
  <text x="295" y="72" class="label" font-size="11" font-weight="600" fill="#5B8DEF">Feature Tree</text>
  <text x="375" y="72" class="label" font-size="8" fill="#5B8DEF">(T, B, L)</text>

  <!-- Tree content sketch -->
  <rect x="278" y="84" width="8" height="8" rx="2" fill="#5B8DEF"/>
  <text x="290" y="92" class="mono" font-size="8">Report formatter</text>
  <line x1="282" y1="94" x2="282" y2="130" stroke="#DFE6E9" stroke-width="0.8"/>
  <line x1="282" y1="106" x2="288" y2="106" stroke="#DFE6E9" stroke-width="0.8"/>
  <line x1="282" y1="120" x2="288" y2="120" stroke="#DFE6E9" stroke-width="0.8"/>
  <line x1="282" y1="134" x2="288" y2="134" stroke="#DFE6E9" stroke-width="0.8"/>

  <circle cx="292" cy="106" r="3" fill="#5B8DEF"/>
  <text x="300" y="109" class="mono" font-size="7">Page layout engine</text>

  <circle cx="292" cy="120" r="3" fill="none" stroke="#4ECDC4" stroke-width="1.2"/>
  <text x="300" y="123" class="mono" font-size="7" fill="#4ECDC4">Margin overrides</text>
  <text x="410" y="123" class="mono" font-size="5.5" fill="#4ECDC4">NEW</text>

  <circle cx="292" cy="134" r="3" fill="#5B8DEF"/>
  <text x="300" y="137" class="mono" font-size="7">Cross-ref resolver</text>
  <circle cx="390" cy="134" r="3" fill="#FF6B9D"/>
  <text x="396" y="137" class="mono" font-size="5.5" fill="#FF6B9D">drift</text>

  <!-- Bindings indicator -->
  <text x="278" y="157" class="label" font-size="7" fill="#999">Bindings: chunk → feature</text>
  <!-- Ledger indicator -->
  <text x="278" y="170" class="label" font-size="7" fill="#999">Ledger: who decided what, when</text>
  <!-- Proposals indicator -->
  <text x="278" y="183" class="label" font-size="7" fill="#999">Proposals: accept / reject</text>
  <!-- Hold set indicator -->
  <text x="278" y="196" class="label" font-size="7" fill="#999">Hold set: in-flight human edits</text>

  <!-- ===== LEFT: Code / Repository ===== -->
  <rect x="40" y="80" width="150" height="110" rx="8" fill="#F8F9FA" stroke="#DFE6E9" stroke-width="1.2"/>
  <text x="80" y="100" class="label" font-size="11" font-weight="500">Repository</text>

  <text x="58" y="118" class="mono" font-size="7">src/layout/margins.ts</text>
  <text x="58" y="130" class="mono" font-size="7">src/crossref/resolve.ts</text>
  <text x="58" y="142" class="mono" font-size="7">src/format/render.ts</text>
  <text x="58" y="154" class="mono" font-size="7" fill="#4ECDC4">+ src/config/overrides.ts</text>
  <text x="58" y="168" class="mono" font-size="6" fill="#999">indexed via tree-sitter</text>
  <text x="58" y="178" class="mono" font-size="6" fill="#999">chunks = (file, symbol, h_tok, h_ast)</text>

  <!-- ===== RIGHT: Developer ===== -->
  <rect x="530" y="60" width="150" height="80" rx="8" fill="#FFF8E8" stroke="#F0932B" stroke-width="1.2"/>
  <text x="570" y="82" class="label" font-size="11" font-weight="500" fill="#2D3436">Developer</text>
  <text x="548" y="100" class="label" font-size="8" fill="#666">reads features</text>
  <text x="548" y="113" class="label" font-size="8" fill="#666">accepts / rejects proposals</text>
  <text x="548" y="126" class="label" font-size="8" fill="#666">edits descriptions</text>

  <!-- ===== BOTTOM RIGHT: Coding Agent ===== -->
  <rect x="530" y="180" width="150" height="60" rx="8" fill="#F0FFF0" stroke="#4ECDC4" stroke-width="1.2"/>
  <text x="565" y="200" class="label" font-size="11" font-weight="500">Coding Agent</text>
  <text x="548" y="218" class="label" font-size="8" fill="#666">receives directives</text>
  <text x="548" y="231" class="label" font-size="8" fill="#666">changes code in live session</text>

  <!-- ===== LOOP A: Code → Tree (top arc) ===== -->
  <!-- Arrow from Repository to Feature Tree -->
  <path d="M 190,110 C 220,70 240,55 260,80" fill="none" stroke="#4ECDC4" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="195" y="42" width="60" height="18" rx="4" fill="#E8FFF8"/>
  <text x="200" y="54" class="label" font-size="8" font-weight="600" fill="#4ECDC4">Loop A</text>

  <!-- Loop A details -->
  <text x="130" y="38" class="label" font-size="7" fill="#4ECDC4">code changes →</text>
  <text x="130" y="48" class="label" font-size="7" fill="#4ECDC4">proposals + refreshes</text>

  <!-- ===== LOOP B: Tree → Code (bottom arc) ===== -->
  <!-- Arrow from Feature Tree down to Coding Agent, then to Repository -->
  <path d="M 460,170 C 490,200 520,200 530,200" fill="none" stroke="#FF6B9D" stroke-width="2" marker-end="url(#arrow-pink)"/>
  <!-- Arrow from Agent back to Repository -->
  <path d="M 530,230 C 400,280 200,260 115,190" fill="none" stroke="#FF6B9D" stroke-width="2" marker-end="url(#arrow-pink)"/>

  <rect x="400" y="248" width="60" height="18" rx="4" fill="#FFF0F5"/>
  <text x="405" y="260" class="label" font-size="8" font-weight="600" fill="#FF6B9D">Loop B</text>

  <!-- Loop B details -->
  <text x="462" y="250" class="label" font-size="7" fill="#FF6B9D">intent edits →</text>
  <text x="462" y="260" class="label" font-size="7" fill="#FF6B9D">directives → code</text>

  <!-- ===== Developer → Tree arrows ===== -->
  <path d="M 530,100 L 462,110" fill="none" stroke="#F0932B" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="470" y="96" class="label" font-size="7" fill="#F0932B">verdicts, edits,</text>
  <text x="470" y="106" class="label" font-size="7" fill="#F0932B">comments</text>

  <!-- Tree → Developer arrows -->
  <path d="M 460,80 L 530,75" fill="none" stroke="#5B8DEF" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="470" y="68" class="label" font-size="7" fill="#5B8DEF">proposals, status,</text>
  <text x="470" y="58" class="label" font-size="7" fill="#5B8DEF">descriptions</text>

  <!-- ===== Key insight callout ===== -->
  <rect x="40" y="275" width="640" height="44" rx="6" fill="#F8F9FA" stroke="#DFE6E9" stroke-width="1"/>
  <text x="60" y="293" class="label" font-size="9" font-weight="600" fill="#2D3436">Key invariant:</text>
  <text x="155" y="293" class="label" font-size="9" fill="#555">The feature tree is both the developer's comprehension surface and the agent's work-order source.</text>
  <text x="60" y="308" class="label" font-size="9" fill="#555">Loop A keeps it faithful to the code. Loop B keeps the code faithful to it. The developer reviews and decides at the boundary.</text>

  <!-- ===== CAPTION ===== -->
  <line x1="16" y1="335" x2="704" y2="335" stroke="#DFE6E9" stroke-width="0.5"/>
  <text x="16" y="352" class="caption" font-size="7.5">
    <tspan font-weight="600" fill="#2D3436">Figure 2.</tspan>
    <tspan fill="#555"> System architecture. The feature tree (center) is the shared representation between the developer and the coding agent.</tspan>
  </text>
  <text x="16" y="364" class="caption" font-size="7.5" fill="#555">Loop A (green) reflects code changes into the tree as proposals or status updates. Loop B (pink) drains the developer's edits and verdicts into directives</text>
  <text x="16" y="376" class="caption" font-size="7.5" fill="#555">that the agent implements. The developer never edits code through codoc — they edit intent, and the agent implements.</text>
</svg>
